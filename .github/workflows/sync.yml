name: Auto-Sync Intervals.icu Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Noodzakelijk zodat de actie mag schrijven naar je repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Section 11 Sync Script
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETE_ID: ${{ secrets.ATHLETE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python examples/sync.py \
            --intervals-key "$INTERVALS_API_KEY" \
            --athlete-id "$ATHLETE_ID" \
            --github-repo "${{ github.repository }}" \
            --github-token "$GITHUB_TOKEN"
